<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.jpg">
<title>Pickard SSOW &amp; SOPs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy brand bar + tricolour rule, single working column (wide for admin), sticky reading HUD in the reader */
:root{
  --navy:#0E2A56; --navy-ink:#FFFFFF;
  --red:#C8102E; --red-soft:#FBE7EA;
  --blue:#1E5BB8; --blue-soft:#E6EEFA;
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#EAEFF6;
  --ink:#0C1A2E; --muted:#56667E; --line:#D3DBE6; --line-strong:#B5C1D2;
  --ok:#17784A; --ok-soft:#E3F3EA; --warn:#A95E00; --warn-soft:#FDF0DC; --bad:#B3261E; --bad-soft:#FBE4E2;
  --focus:#1E5BB8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#071224; --navy-ink:#F2F5FA; --red:#FF5468; --red-soft:#3A1520; --blue:#7AA7FF; --blue-soft:#14284A;
  --bg:#0A1325; --surface:#101D35; --sunk:#0C182C; --ink:#E7EDF6; --muted:#9AA9C0; --line:#22345A; --line-strong:#33497A;
  --ok:#55C98D; --ok-soft:#10301F; --warn:#F2B04C; --warn-soft:#33240D; --bad:#FF7A70; --bad-soft:#3A1614; --focus:#7AA7FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#071224; --navy-ink:#F2F5FA; --red:#FF5468; --red-soft:#3A1520; --blue:#7AA7FF; --blue-soft:#14284A;
  --bg:#0A1325; --surface:#101D35; --sunk:#0C182C; --ink:#E7EDF6; --muted:#9AA9C0; --line:#22345A; --line-strong:#33497A;
  --ok:#55C98D; --ok-soft:#10301F; --warn:#F2B04C; --warn-soft:#33240D; --bad:#FF7A70; --bad-soft:#3A1614; --focus:#7AA7FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* Brand bar */
/* brand plate stays white in both themes so the logo sits on its own background */
.brand{background:#FFFFFF;color:#0E2A56;position:relative}
.brand-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
.mark img{height:clamp(44px,8vw,60px);width:auto;display:block}
.mark span{font-family:var(--f-display);font-weight:700;font-size:clamp(15px,2.8vw,19px);letter-spacing:.12em;text-transform:uppercase;line-height:1;padding:8px 0 8px 16px;border-left:2px solid #C9D3E3;white-space:nowrap;color:#0E2A56}
.tricolour{height:6px;display:grid;grid-template-columns:1fr 1fr 1fr}
.tricolour i:nth-child(1){background:#C8102E}.tricolour i:nth-child(2){background:#FFFFFF}.tricolour i:nth-child(3){background:#1E5BB8}
.tabs{margin-left:auto;display:flex;gap:4px;background:#EEF2F8;padding:4px;border-radius:8px}
.tabs button{background:none;border:0;color:#0E2A56;padding:7px 14px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;opacity:.7}
.tabs button[aria-pressed="true"]{background:#0E2A56;color:#FFFFFF;opacity:1}
.tabs button:focus-visible{outline-color:#1E5BB8}

.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.wrap.wide{max-width:1180px}

/* Type */
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.h-xl{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:.01em;margin:6px 0 12px;text-transform:uppercase}
.h-l{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
.h-m{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15;margin:0;letter-spacing:.02em;text-transform:uppercase}
.lede{color:var(--muted);max-width:62ch;margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--surface);padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.ghost{border-color:transparent;background:none;padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:14px}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field.span2{grid-column:1 / -1}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px;align-items:start}
@media (max-width:560px){.form2{grid-template-columns:minmax(0,1fr)}}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.stack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.note{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:15px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}

/* Welcome choice */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:22px}
.choice{text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:8px;transition:border-color .15s, transform .15s}
.choice:hover{border-color:var(--navy);transform:translateY(-2px)}
.choice .k{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.choice .k i{font-style:normal;color:var(--red)}
.choice p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.choice{transition:none}.choice:hover{transform:none}}

/* Ref badge (document stamp) */
.ref{display:inline-flex;align-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.02em;padding:3px 8px;border-radius:4px;color:#fff;background:var(--blue);white-space:nowrap}
.ref.ssow{background:var(--red)}
:root[data-theme="dark"] .ref{color:#0A1325}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ref{color:#0A1325}}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.due{color:var(--warn);background:var(--warn-soft)}
.chip.expired,.chip.resign{color:var(--bad);background:var(--bad-soft)}
.chip.todo{color:var(--muted);background:var(--sunk)}
.chip.prog{color:var(--blue);background:var(--blue-soft)}

/* Person bar & progress */
.personbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.personbar .who{font-weight:700;font-size:18px}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.meter.time>i{background:var(--blue)}
.meter.time.done>i{background:var(--ok)}

/* Doc list */
.topic{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.topic-h{display:flex;gap:10px;align-items:baseline;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.topic-h .num{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.docrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.docrow:first-of-type{border-top:0}
.docrow .t{font-weight:600}
.docrow .meta{font-size:13px;color:var(--muted)}
.docrow .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.docrow{grid-template-columns:auto minmax(0,1fr)}.docrow .act{grid-column:1 / -1;justify-content:flex-start}}

/* Reader */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(12,26,46,.06)}
.hud-in{max-width:860px;margin:0 auto;padding:10px 16px;display:grid;gap:8px}
.hud-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hud-title{font-weight:700;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-req{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hud-req b{color:var(--ink)}
.tick{display:inline-flex;gap:6px;align-items:center}
.tick::before{content:"";width:14px;height:14px;border-radius:3px;border:2px solid var(--line-strong)}
.tick.yes{color:var(--ok)}
.tick.yes::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--surface)}
.paused{display:none;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px;padding:6px 10px;border-radius:var(--r)}
.paused.on{display:block}

.doc-head{padding-block:28px 8px}
.doc-head .h-xl{font-size:clamp(30px,5vw,44px)}
.docmeta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--muted);margin-top:8px}
.docmeta b{color:var(--ink);font-weight:600}
.doc{font-size:17px;line-height:1.65}
.doc h2{font-family:var(--f-display);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.02em;margin:40px 0 10px;padding-top:14px;border-top:2px solid var(--navy)}
.doc h3{font-family:var(--f-display);font-weight:700;font-size:20px;margin:26px 0 8px;color:var(--blue);letter-spacing:.02em}
.doc h4{font-size:17px;margin:20px 0 6px}
.doc p,.doc li{max-width:68ch}
.doc ol,.doc ul{padding-left:1.4em}
.doc li{margin:6px 0}
.doc li::marker{color:var(--red);font-weight:700}
.doc .tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px}
.doc table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
.doc th{background:var(--navy);color:var(--navy-ink);text-align:left;font-weight:600;padding:9px 12px}
.doc td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.doc tr:nth-child(even) td{background:var(--sunk)}
.doc td p{margin:0}
.doc .hold{border:2px solid var(--red);background:var(--red-soft);padding:12px 14px;border-radius:var(--r);max-width:none}
.doc a{color:var(--blue)}

.endmark{display:flex;align-items:center;gap:12px;margin:40px 0 18px;color:var(--muted);font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.endmark::before,.endmark::after{content:"";flex:1;height:2px;background:var(--line)}

.sign{border:2px solid var(--navy);border-radius:12px;background:var(--surface);overflow:hidden}
.sign-h{background:var(--navy);color:var(--navy-ink);padding:14px 20px}
.sign-b{padding:20px;display:grid;gap:18px}
.reqs{display:grid;gap:8px}
.reqs .tick{font-weight:600;color:var(--muted)}
.reqs .tick.yes{color:var(--ok)}
.declare{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line-strong);border-radius:var(--r);cursor:pointer}
.declare input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--red)}
.declare.locked{opacity:.5;cursor:not-allowed}
.pad{position:relative;border:1.5px dashed var(--line-strong);border-radius:var(--r);background:var(--sunk);height:170px;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.pad .base{position:absolute;left:18px;right:18px;bottom:36px;border-bottom:1.5px solid var(--line-strong);pointer-events:none}
.pad .lbl{position:absolute;left:18px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none;letter-spacing:.08em;text-transform:uppercase}
.pad.locked{opacity:.5;pointer-events:none}

/* Admin */
.subtabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.subtabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.stat.bad .n{color:var(--bad)}.stat.warn .n{color:var(--warn)}.stat.ok .n{color:var(--ok)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:14px}
table.data th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--sunk)}
.matrix td.cell{text-align:center;padding:6px 4px}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--sunk);border:1.5px solid var(--line-strong)}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.due{background:var(--warn);border-color:var(--warn)}
.dot.expired,.dot.resign{background:var(--bad);border-color:var(--bad)}
.dot.na{background:none;border-style:dotted;opacity:.4}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:11px;padding:8px 4px;letter-spacing:0;text-transform:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.toolbar .field{min-width:150px;flex:1}
.toolbar .field.grow{flex:3}

.rules{display:grid;gap:14px}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.rule{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.rule .sign{flex:none;width:52px;height:52px;border-radius:50%;background:#1E5BB8;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface),0 0 0 4px #1E5BB8}
.rule .sign svg{width:32px;height:32px}
.rule b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.rule span{font-size:14px;color:var(--muted)}
.comply{border:2px solid var(--red);background:var(--red-soft);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.comply svg{flex:none;width:28px;height:28px;color:var(--red);margin-top:1px}
.comply p{margin:0;font-weight:600}
.acts{border:0;padding:16px 0 0;margin:0;border-top:1px solid var(--line);min-width:0}
.acts legend{padding:0;float:left;width:100%}
.acts legend + *{clear:both}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.act{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600}
.act input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin:0}
.act:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.actchips{display:flex;gap:4px;flex-wrap:wrap}
.actchips .chip{font-size:12px;padding:2px 8px}
.updocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.upblock{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;align-content:start;background:var(--bg)}
.upblock-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upblock-h b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:0}
.upfile{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.upfile .ext{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:3px 6px;border-radius:3px;background:var(--navy);color:var(--navy-ink);text-transform:uppercase;flex:none;margin-top:2px}
.upfile .nm{font-weight:600;word-break:break-word}
.upfile .dt{font-size:13px;color:var(--muted)}
.upform{display:grid;gap:12px;padding:14px;border:1.5px solid var(--blue);border-radius:var(--r);background:var(--surface)}
.dropzone{border:2px dashed var(--line-strong);border-radius:12px;padding:30px 20px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center;transition:border-color .15s,background .15s}
.dropzone .dz-k{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.dropzone .dz-k i{font-style:normal;color:var(--red)}
.dropzone .dz-icon{width:46px;height:46px;color:var(--blue)}
.dropzone.over{border-color:var(--blue);border-style:solid;background:var(--blue-soft)}
.preview.over{border-color:var(--blue);border-style:dashed;background:var(--blue-soft)}
@media (prefers-reduced-motion:reduce){.dropzone{transition:none}}
.stage td input.input{padding:6px 8px;width:110px}
.stage .fname{font-size:12px;color:var(--muted);word-break:break-all;max-width:220px}
.stage .ver{white-space:nowrap}
.stage label.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.stage label.chk input{width:18px;height:18px;accent-color:var(--red)}
.preview{border:1.5px solid var(--line-strong);border-radius:var(--r);padding:4px 20px 20px;max-height:560px;overflow:auto;background:var(--surface)}
.preview[contenteditable="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.sigimg{color:var(--ink);width:150px;height:50px;display:block}

.overlay{position:fixed;inset:0;background:rgba(5,12,25,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:900px;width:100%;padding:24px;display:grid;gap:18px}

<script>
"use strict";
/* ---------- constants ---------- */

const hasCompany = (t) => t === "subcontractor" || t === "agency";

const S = {
  db: null, user: null, uid: null, isAdmin: false, canWrite: null, offline: false,
  docs: [], docsLoaded: false, settings: { ...DEFAULTS },
  mode: "self", personKey: null, person: null, personUnsub: null, draftType: null, readOnlyReason: null,
  tab: "user", view: "welcome", adminTab: "records", people: [], peopleLoaded: false, peopleUnsub: null,
  filters: { q: "", type: "all", status: "all" }, editing: null, staged: [], publishing: false,
  pq: "", ptype: "all", peopleSel: new Set(), pendingDel: null, bulkConfirm: false, deleting: false,
};
let R = null; // active reader state

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mmss = (s) => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "";
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
function addMonths(iso, m) { const d = new Date(iso); const day = d.getDate(); d.setMonth(d.getMonth() + Number(m || 12)); if (d.getDate() < day) d.setDate(0); return d.toISOString(); }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }

function toast(msg, ms = 2800) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; $("#toastSlot").replaceChildren(el); setTimeout(() => el.remove(), ms); }
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = () => window[globalName] ? res(window[globalName]) : rej(new Error("Library did not load")); s.onerror = () => rej(new Error("Library could not be loaded")); document.head.appendChild(s); });
}
function slug(s) { return String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 90); }
function topicNum(ref) { const m = /(\d+)/.exec(ref || ""); return m ? m[1] : ""; }

/* write queue: one write at a time per document */
const queues = new Map();
function enqueue(path, fn) { const prev = queues.get(path) || Promise.resolve(); const next = prev.catch(() => {}).then(fn); queues.set(path, next); return next; }

/* ---------- HTML sanitiser (documents are rendered from shared data) ---------- */
const ALLOWED = new Set(["H2", "H3", "H4", "P", "UL", "OL", "LI", "STRONG", "EM", "B", "I", "U", "TABLE", "THEAD", "TBODY", "TR", "TH", "TD", "BR", "A", "BLOCKQUOTE"]);
const DROP = new Set(["SCRIPT", "STYLE", "IMG", "IFRAME", "OBJECT", "EMBED", "SVG", "NOSCRIPT", "TEMPLATE", "COLGROUP", "COL", "LINK", "META", "FORM", "INPUT", "BUTTON", "VIDEO", "AUDIO", "CANVAS"]);
function cleanNode(node) {
  for (const ch of [...node.childNodes]) {
    if (ch.nodeType === 3) continue;
    if (ch.nodeType !== 1) { ch.remove(); continue; }
    let el = ch;
    if (DROP.has(el.tagName)) { el.remove(); continue; }
    if (el.tagName === "H1") { const h = document.createElement("h2"); h.append(...el.childNodes); el.replaceWith(h); el = h; }
    if (el.tagName === "H5" || el.tagName === "H6") { const h = document.createElement("h4"); h.append(...el.childNodes); el.replaceWith(h); el = h; }
    cleanNode(el);
    if (!ALLOWED.has(el.tagName)) { el.replaceWith(...el.childNodes); continue; }
    for (const a of [...el.attributes]) { if (!(el.tagName === "A" && a.name === "href" && /^https?:\/\//i.test(a.value))) el.removeAttribute(a.name); }
  }
}
function sanitize(html) { const d = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html"); const root = d.body.firstElementChild; cleanNode(root); return root.innerHTML; }
function renderDocHTML(html) {
  const d = new DOMParser().parseFromString(`<div>${sanitize(html)}</div>`, "text/html"); const root = d.body.firstElementChild;
  root.querySelectorAll("table").forEach((t) => { const w = d.createElement("div"); w.className = "tw"; t.replaceWith(w); w.appendChild(t); });
  root.querySelectorAll("p").forEach((p) => { const f = p.firstElementChild; if (f && /^(STRONG|B)$/.test(f.tagName) && /^hold point/i.test(f.textContent.trim())) p.className = "hold"; });
  root.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  return root.innerHTML;
}
function wordCount(html) { const d = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html"); return (d.body.textContent || "").split(/\s+/).filter(Boolean).length; }

/* ---------- domain ---------- */
const activeDocs = () => S.docs.filter((d) => d.active !== false).sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || String(a.ref).localeCompare(String(b.ref)));
/* a person's documents: right audience, and activity-specific documents only if they ticked that activity */
const docsFor = (p) => activeDocs().filter((d) => (!d.audience || d.audience === "all" || d.audience === p?.type)
  && (!d.activity || (Array.isArray(p?.activities) && p.activities.includes(d.activity))));
const requiredSec = (doc) => doc.minMinutes ? Math.round(Number(doc.minMinutes) * 60) : Math.max(60, Math.round(((doc.words || wordCount(doc.html)) / (Number(S.settings.wpm) || 250)) * 60));
function statusOf(person, doc, now = Date.now()) {
  const r = person?.records?.[doc.ref];
  if (!r) { const p = person?.progress?.[doc.ref]; return (p && p.sec > 0 && String(p.version) === String(doc.version)) ? "prog" : "todo"; }
  if (String(r.version) !== String(doc.version)) return "resign";
  const days = (new Date(r.renewsAt).getTime() - now) / 864e5;
  if (days < 0) return "expired";
  if (days <= (Number(S.settings.dueSoonDays) || 30)) return "due";
  return "ok";
}
const isDone = (st) => st === "ok" || st === "due";

/* ---------- sub-contractor uploads (PLI certificate, risk assessments) ----------
   Files are stored in the app's database in ~190 KB pieces under people/<key>/blobs/<fileId>/c/<n>;
   a summary of each file lives in the person's record (files map) so the admin pages don't need to read the pieces. */
const MAX_UPLOAD = 10 * 1024 * 1024, CHUNK = 190000;
const UP_KIND = { pli: "Public liability insurance", ra: "Risk assessment" };
/* activities that need a licence; a licence upload is stored as file kind "lic-<id>" */
const ACTIVITIES = [
  { id: "truck", label: "Truck driving", lic: "Driver CPC licence", licText: "Driver CPC licence", short: "Truck", hint: "Your Driver CPC card (Driver Qualification Card) showing its expiry date. You can add your driving licence as a second file." },
  { id: "van", label: "Van driving", lic: "Driving licence", short: "Van", hint: "A clear photo of the front of your photocard driving licence." },
  { id: "forklift", label: "Forklifting", lic: "Forklift licence", short: "Forklift", hint: "Your operator certificate or card (RTITB, AITT, ITSSAR or NPORS). Use the refresher or expiry date shown on it." },
  { id: "mewp", label: "MEWPs", lic: "IPAF PAL card", short: "IPAF", hint: "A clear photo of the front of your IPAF PAL card showing your categories and expiry date." },
  { id: "electrical", label: "Installing electrical systems", lic: "Electrical certificates and qualifications", short: "Electrical", noun: "certificate", multi: true, hint: "For example your 18th Edition (BS 7671), inspection and testing (2391 or 2394/2395), NVQ Level 3 or ECS/JIB card. Upload each one separately." },
  { id: "shell", label: "Installing shell scheme", short: "Shell scheme", noLicence: true },
];
const LIC_ACTS = ACTIVITIES.filter((a) => !a.noLicence);
const actById = (id) => ACTIVITIES.find((a) => a.id === id);
const personActs = (p) => (Array.isArray(p?.activities) ? p.activities : []).map(actById).filter(Boolean);
const licActs = (p) => personActs(p).filter((a) => !a.noLicence);
function expiryState(f, now = Date.now()) {
  if (!f?.expiry) return "ok";
  const days = (new Date(f.expiry + "T23:59:59").getTime() - now) / 864e5;
  return days < 0 ? "expired" : days <= (Number(S.settings.dueSoonDays) || 30) ? "due" : "ok";
}
function licStatus(p, id, now = Date.now()) {
  const a = actById(id);
  if (!a || a.noLicence || !(p?.activities || []).includes(id)) return { st: "na", label: "Not needed" };
  const files = personFiles(p, "lic-" + id); const f = files[0];
  if (a.multi) { // several certificates: expired only when every one has expired
    if (!f) return { st: "todo", label: "Certificates missing" };
    const sts = files.map((x) => expiryState(x, now));
    const st = sts.every((x) => x === "expired") ? "expired" : sts.includes("due") ? "due" : "ok";
    return { st, f, label: st === "expired" ? "Certificates expired" : st === "due" ? "One expires soon" : `${files.length} uploaded` };
  }
  if (!f) return { st: "todo", label: "Licence missing" };
  const st = expiryState(f, now);
  return { st, f, label: st === "expired" ? "Licence expired" : st === "due" ? "Expires soon" : "Licence in date" };
}
const licProblems = (p) => licActs(p).filter((a) => ["todo", "expired"].includes(licStatus(p, a.id).st));
const UP_EXT = { "application/pdf": "pdf", "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "docx" };
const UP_ACCEPT = ".pdf,.jpg,.jpeg,.png,.webp,.docx";
function fileExt(name, mime) { const m = /\.([a-z0-9]{2,5})$/i.exec(name || ""); return (m ? m[1] : UP_EXT[mime] || "file").toLowerCase(); }
function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
function personFiles(p, kind) { return Object.entries(p?.files || {}).map(([fid, m]) => ({ fid, ...m })).filter((f) => !f.deleted && (!kind || f.kind === kind)).sort((a, b) => String(b.uploadedAt).localeCompare(String(a.uploadedAt))); }
function pliStatus(p, now = Date.now()) {
  if (p?.type !== "subcontractor") return { st: "na", label: "Not needed" };
  const f = personFiles(p, "pli")[0];
  if (!f) return { st: "todo", label: "PLI missing" };
  if (!f.expiry) return { st: "ok", label: "PLI uploaded", f };
  const days = (new Date(f.expiry + "T23:59:59").getTime() - now) / 864e5;
  if (days < 0) return { st: "expired", label: "PLI expired", f };
  if (days <= (Number(S.settings.dueSoonDays) || 30)) return { st: "due", label: "PLI expires soon", f };
  return { st: "ok", label: "PLI in date", f };
}
const fmtDay = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "";
function fileToB64(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("The file couldn't be read")); r.readAsDataURL(file); }); }
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1048576 || typeof createImageBitmap !== "function") return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) { if (i >= 4 || !["resource_exhausted", "unavailable"].includes(e?.code)) throw e; await new Promise((r) => setTimeout(r, 800 * (i + 1) + Math.random() * 400)); }
  }
}
async function uploadFile(kind, file, meta, onStep) {
  file = await shrinkImage(file);
  if (file.size > MAX_UPLOAD) throw { code: "too_big" };
  onStep && onStep(1, 1);
  const fd = new FormData(); fd.append("kind", kind); fd.append("meta", JSON.stringify(meta || {})); fd.append("file", file, file.name);
  const r = await api("/api/me/files", { method: "POST", form: fd });
  S.person = toPerson(r.person);
  return r.person;
}
async function removeFile(key, fid) {
  const r = await api(`/api/me/files/${encodeURIComponent(fid)}`, { method: "DELETE" });
  S.person = toPerson(r.person);
}
async function downloadFile(key, fid) {
  const p = S.people.find((x) => x.key === key) || (S.personKey === key ? S.person : null); const f = p?.files?.[fid]; if (!f) return;
  toast(`Preparing ${f.name}…`);
  try {
    const headers = {}; const pw = ssGet(ADMIN_PW_KEY); if (pw) headers["x-admin-password"] = pw;
    const res = await fetch(`/api/admin/files/${encodeURIComponent(key)}/${encodeURIComponent(fid)}`, { headers, credentials: "same-origin" });
    if (!res.ok) throw new Error(res.status === 404 ? "the file is missing" : "the server refused");
    const ext = fileExt(f.name, f.mime);
    const base = (String(f.kind).startsWith("lic-") ? `${p.name} - ${f.title || actById(f.kind.slice(4))?.lic || "Licence"}` : `${p.company || p.name} - ${f.kind === "pli" ? "PLI certificate" : (f.title || "Risk assessment")}`).replace(/[\\/:*?"<>|]+/g, " ").trim();
    saveBlob(`${base}.${ext}`, await res.blob());
  } catch (e) { toast(`Couldn't download the file: ${e?.message || "try again"}`, 4500); }
}

/* ---------- server API ---------- */
const TOKEN_KEY = "pes-person-token", ADMIN_PW_KEY = "pes-admin-pw";
function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }
async function api(path, { method = "GET", body, form, keepalive } = {}) {
  const headers = {};
  const t = getToken(); if (t) headers["x-person-token"] = t;
  const pw = ssGet(ADMIN_PW_KEY); if (pw && path.startsWith("/api/admin")) headers["x-admin-password"] = pw;
  let payload;
  if (form) payload = form;
  else if (body !== undefined) { headers["content-type"] = "application/json"; payload = JSON.stringify(body); }
  let res;
  try { res = await fetch(path, { method, headers, body: payload, keepalive, credentials: "same-origin" }); }
  catch { throw { code: "network", status: 0, message: "Couldn't reach the server. Check your connection and try again." }; }
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) throw { code: res.status, status: res.status, message: data?.error || "Something went wrong. Please try again.", data };
  return data;
}
const toPerson = (p) => (p ? { ...p, key: p.key } : null);
/* save a generated file (spreadsheet, uploaded certificate) to the viewer's computer */
function saveBlob(filename, blob) {
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------- boot ---------- */
async function boot() {
  wireGlobal();
  S.isAdmin = location.pathname === "/admin" || location.pathname.startsWith("/admin/");
  S.mode = "device";
  S.adminPwLoaded = true; S.adminPw = null;
  try {
    const b = await api("/api/bootstrap");
    S.docs = b.documents || []; S.settings = { ...DEFAULTS, ...(b.settings || {}) }; S.docsLoaded = true;
  } catch { S.offline = true; renderMain(); return; }
  if (S.isAdmin) {
    $("#tabs").hidden = false; S.tab = "admin";
    $("#tab-user").setAttribute("aria-pressed", "false"); $("#tab-admin").setAttribute("aria-pressed", "true");
    checkAdmin();
  }
  if (getToken()) attachPerson();
  if (S.isAdmin) renderAdmin(); else renderMain();
  // keep things fresh: documents when staff come back to the page, admin lists every 30 seconds
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshData(); });
  setInterval(() => { if (S.tab === "admin" && S.adminOk && document.visibilityState === "visible") loadAdminData(); }, 30000);
}
let lastRefresh = Date.now();
async function refreshData() {
  if (Date.now() - lastRefresh < 60000) return; lastRefresh = Date.now();
  if (S.tab === "admin" && S.adminOk) return loadAdminData();
  if (R) return; // don't disturb someone who is reading
  try { const b = await api("/api/bootstrap"); S.docs = b.documents || []; S.settings = { ...DEFAULTS, ...(b.settings || {}) }; onDataChange("docs"); } catch {}
}
async function checkAdmin() {
  S.adminChecked = false;
  try { const w = await api("/api/admin/whoami"); S.adminOk = true; S.adminWho = w; S.adminMode = w.mode; await loadAdminData(); }
  catch (e) { S.adminOk = false; S.adminMode = e?.data?.mode || "none"; }
  S.adminChecked = true; if (S.tab === "admin") renderAdmin();
}
async function loadAdminData() {
  try {
    const [d, p] = await Promise.all([api("/api/admin/documents"), api("/api/admin/people")]);
    S.docs = d.documents || []; S.docsLoaded = true;
    S.people = (p.people || []).map(toPerson); S.peopleLoaded = true;
    if (S.tab === "admin") softRenderAdmin();
  } catch (e) { if (e?.status === 401) { S.adminOk = false; if (S.tab === "admin") renderAdmin(); } }
}
async function attachPerson() {
  S.personLoading = true; S.personLoaded = false;
  try {
    const r = await api("/api/me");
    S.person = toPerson(r.person); S.personKey = S.person.key;
    if (S.view === "welcome") S.view = "home";
  } catch (e) {
    if (e?.status === 401) setToken(null);
    S.person = null; S.personKey = null;
  }
  S.personLoading = false; S.personLoaded = true;
  onDataChange("person");
}
function softRenderAdmin() { if (S.editing || S.adminTab === "settings" || document.activeElement?.id === "nt-body") return; renderAdmin(); }
function onDataChange(what) {
  if (S.tab === "admin") { softRenderAdmin(); return; }
  if (S.view === "reader") { if (what === "person" && R) updateHud(); return; }
  if (S.view === "details") return;
  if (S.view === "home" && S.upOpen) return; // don't wipe an upload form that's being filled in
  renderMain();
}

/* ---------- top-level render ---------- */
function setTab(t) {
  if (R) leaveReader(false);
  if (t !== "admin") S.adminUnlocked = false;
  S.tab = t; $("#tab-user").setAttribute("aria-pressed", t === "user"); $("#tab-admin").setAttribute("aria-pressed", t === "admin");
  if (t === "admin") { ensurePeople(); renderAdmin(); } else { renderMain(); }
}
function renderMain() {
  const main = $("#main"); $("#hudSlot").innerHTML = ""; main.className = "wrap";
  if (S.tab === "admin") return renderAdmin();
  if (S.offline) { main.innerHTML = `<div class="panel stack"><div class="eyebrow">Can't connect</div><h1 class="h-l">The server can't be reached</h1><p class="lede">Check your internet connection and refresh the page. If it still doesn't load, let the office know.</p><div><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`; return; }
  if (S.readOnlyReason === "signedout") { main.innerHTML = `<div class="panel stack"><div class="eyebrow">Sign in needed</div><h1 class="h-l">Sign in to record your sign-offs</h1><p class="lede">Your sign-offs are saved against your Claude account. Sign in to claude.ai and open this link again, or complete your sign-off on the office device.</p></div>`; return; }
  if (S.view === "reader" && R) return; // reader manages itself
  if (S.personLoading) { main.innerHTML = `<div class="empty"><span class="spin"></span><p>Loading your record…</p></div>`; return; }
  if (S.view === "details") return renderDetails();
  if (!S.person || S.view === "welcome") return renderWelcome();
  renderHome();
}

/* ---------- welcome ---------- */
function renderWelcome() {
  S.view = "welcome";
  $("#main").innerHTML = `

const normName = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z\s'-]/g, "").replace(/[\s'-]+/g, " ").trim();
async function findReturning(e, id) {

  } else {

/* Turn a Word file into a document record: content, reference and control-table details */
function normRef(kind, num) { return `${kind.toUpperCase()}-${String(num).padStart(2, "0")}`; }
function findRef(text) { const m = /\b(SSOW|SOP)[\s_-]*(\d{1,3})\b/i.exec(text || ""); return m ? normRef(m[1], m[2]) : ""; }
function bumpVersion(v) { const s = String(v || "1.0"); const m = /^(.*?)(\d+)(\D*)$/.exec(s); return m ? `${m[1]}${Number(m[2]) + 1}${m[3]}` : s + ".1"; }

  const h1 = root.querySelector("h1");
  if (h1) {
    out.fullTitle = h1.textContent.trim().replace(/\s+/g, " ");
    out.title = out.fullTitle.split(/\s[–-]\s/).slice(1).join(" – ").trim() || out.fullTitle;
    const nxt = h1.nextElementSibling; if (nxt && nxt.tagName === "P" && /Pickard Event Services/i.test(nxt.textContent) && nxt.textContent.length < 160) nxt.remove();
    h1.remove();

  const fields = {};
  root.querySelectorAll("tr").forEach((tr) => { const c = tr.querySelectorAll("td,th"); if (c.length === 2) { const k = c[0].textContent.trim(); if (!(k in fields)) fields[k] = c[1].textContent.trim(); } });
  out.version = (fields["Version"] || "").trim();
  out.issued = (fields["Date issued"] || "").trim();
  out.nextReview = (fields["Next review"] || "").split(",")[0].trim();
  out.linked = findRef(fields["Linked SSOW"] || fields["Linked SOP"] || "");

  if (S.adminMode === "access") return `<div class="panel stack" id="noAdmin" style="max-width:620px;margin:24px auto">
    <div><div class="eyebrow">Admin</div><h1 class="h-l" style="margin:0">Sign in needed</h1>
    <p class="lede" style="margin-top:6px">Your Cloudflare Access sign-in has expired or isn't allowed for the admin area. Reload the page to sign in again with your work email.</p></div>
    <div><button class="btn primary" onclick="location.reload()">Reload</button></div></div>`;
  return `<form class="panel stack" id="unlockForm" style="max-width:460px;margin:24px auto">
    <div><div class="eyebrow">Admin</div><h1 class="h-l" style="margin:0">Admin sign-in</h1><p class="lede" style="margin-top:6px">Enter the administrator password to see sign-off records, people, documents and settings.</p></div>
    <div class="field"><label for="unlock-pw">Administrator password</label><input class="input" id="unlock-pw" type="password" autocomplete="current-password"></div>
    <p class="note bad" id="unlockErr" hidden></p>
    <div class="row"><span class="spacer"></span><button class="btn primary" type="submit" id="unlockBtn">Sign in</button></div>
  </form>`;
}
async function tryUnlock(e) {
  e.preventDefault(); const err = $("#unlockErr"); const btn = $("#unlockBtn");
  btn.disabled = true; btn.textContent = "Checking…";
  ssSet(ADMIN_PW_KEY, $("#unlock-pw").value);
  try { const w = await api("/api/admin/whoami"); S.adminOk = true; S.adminWho = w; $("#main").innerHTML = ""; await loadAdminData(); renderAdmin(); }
  catch (ex) {
    ssSet(ADMIN_PW_KEY, null); btn.disabled = false; btn.textContent = "Sign in";
    err.textContent = ex?.status === 401 ? "That password isn't right. Try again." : ex?.message; err.hidden = false; $("#unlock-pw").select();
  }
}
function lockAdmin() { S.adminUnlocked = false; S.editing = null; $("#modalSlot").innerHTML = ""; if (S.tab === "admin") { $("#main").innerHTML = ""; renderAdmin(); } }
function pwPanelHTML() {
  const w = S.adminWho || {};
  return `<div class="panel stack">
    <div><h2 class="h-m">Admin access</h2><p class="small muted" style="margin:4px 0 0">${w.via === "access"
      ? `You're signed in as <b>${esc(w.email)}</b> through Cloudflare Access. To change who can open the admin area, edit the Access application's policy in the Cloudflare dashboard (Zero Trust → Access → Applications).`
      : `You're signed in with the administrator password. To change it, update the ADMIN_PASSWORD secret on the Worker in the Cloudflare dashboard (Workers & Pages → pickard-ssow → Settings → Variables and Secrets). For named logins, set up Cloudflare Access as described in the README.`}</p></div>
    ${w.via === "password" ? `<div class="row"><span class="spacer"></span><button class="btn" type="button" data-act="admin-signout">Sign out</button></div>` : ""}
  </div>`;
}
async function savePw(e) { e.preventDefault(); }
async function removePw() {}
["pointerdown", "keydown", "scroll", "wheel", "touchstart"].forEach((ev) => window.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));
setInterval(() => { if (S.adminPw && S.adminUnlocked && Date.now() - (S.lastAct || 0) > ADMIN_IDLE_MS) { lockAdmin(); toast("Admin locked after 10 minutes without activity."); } }, 15000);
async function saveSettings(e) {
  e.preventDefault(); const btn = $("#stSave"); btn.disabled = true;
  const data = { wpm: Number($("#st-wpm").value) || 250, idleSec: Number($("#st-idle").value) || 60, renewalMonths: Number($("#st-renew").value) || 12, dueSoonDays: Number($("#st-due").value) || 30, updatedAt: new Date().toISOString() };
  try { const r = await api("/api/admin/settings", { method: "PUT", body: data }); S.settings = { ...DEFAULTS, ...r.settings }; toast("Settings saved"); } catch (ex) { toast(ex?.message || "Couldn't save settings. Try again."); }
  btn.disabled = false;
}

/* --- export --- */
async function exportXlsx(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Preparing…";
  try {
    const XLSX = await loadScript(XLSX_SRC, "XLSX");
    const toD = (iso) => iso ? new Date(iso) : "";
    const people = S.people.slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
    const log = [["Name", "Type", "Company", "Role", "Email", "Mobile", "Document ref", "Document title", "Version signed", "Current version", "Completed date", "Renewal date", "Status", "Reading time (mins)", "Minimum (mins)", "Scrolled to end early"]];
    for (const p of people) for (const d of docsFor(p)) {
      const st = statusOf(p, d); const r = p.records?.[d.ref];
      log.push([p.name, TYPE_LABEL[p.type] || "", p.company, p.role, p.email || "", p.phone || "", d.ref, d.title, r ? r.version : "", d.version, toD(r?.signedAt), toD(r?.renewsAt), STATUS_LABEL[st],
        r ? Math.round(r.activeSec / 6) / 10 : "", Math.round((r?.requiredSec || requiredSec(d)) / 6) / 10, r ? (r.skimmed ? "Yes" : "No") : ""]);
    }
    const summ = [["Name", "Type", "Company", "Role", "Email", "Mobile", "Documents required", "Signed and in date", "Outstanding", "Renewals due", "Expired or updated", "Last signed", "Next renewal", "Fully signed", "PLI status", "PLI insurer", "PLI policy no.", "PLI cover", "PLI expiry", "Risk assessments uploaded", "Activities", ...LIC_ACTS.flatMap((a) => [`${a.short} ${a.multi ? "certificates" : "licence"}`, `${a.short} expiry`])]];
    const dayD = (d) => d ? new Date(d + "T12:00:00") : "";
    for (const p of people) { const s = personSummary(p); const sub = p.type === "subcontractor"; const ps = pliStatus(p); const pf = ps.f || {};
      summ.push([p.name, TYPE_LABEL[p.type] || "", p.company, p.role, p.email || "", p.phone || "", s.total, s.done, s.total - s.done, s.sts.filter((x) => x === "due").length, s.sts.filter((x) => x === "expired" || x === "resign").length, toD(s.lastSigned), toD(s.nextRenewal), s.complete ? "Yes" : "No",
        sub ? ps.label : "Not needed", sub ? pf.insurer || "" : "", sub ? pf.policyNo || "" : "", sub ? pf.cover || "" : "", sub ? dayD(pf.expiry) : "", sub ? personFiles(p, "ra").length : "",
        personActs(p).map((a) => a.label).join(", "), ...LIC_ACTS.flatMap((a) => { const ls = licStatus(p, a.id); return ls.st === "na" ? ["", ""] : [ls.label, dayD(ls.f?.expiry)]; })]); }
    const licSheet = [["Name", "Type", "Company", "Mobile", "Activity", "Licence / qualification", "Licence no.", "Expiry", "Uploaded", "Status", "File name"]];
    for (const p of people) for (const a of licActs(p)) {
      const files = personFiles(p, "lic-" + a.id); const ls = licStatus(p, a.id);
      if (!files.length) licSheet.push([p.name, TYPE_LABEL[p.type] || "", p.company, p.phone || "", a.label, a.lic, "", "", "", ls.label, ""]);
      files.forEach((f, i) => { const fs = expiryState(f); licSheet.push([p.name, TYPE_LABEL[p.type] || "", p.company, p.phone || "", a.label, f.title || a.lic, f.licNo || "", dayD(f.expiry), toD(f.uploadedAt), a.multi ? (fs === "expired" ? "Expired" : fs === "due" ? "Expires soon" : "Valid") : i ? "Older copy" : ls.label, f.name]); });
    }
    const subDocs = [["Name", "Company", "Document", "Title / file", "File name", "Insurer", "Policy no.", "Cover", "Expiry / dated", "Uploaded", "Status"]];
    for (const p of people.filter((x) => x.type === "subcontractor")) {
      const fl = personFiles(p).filter((f) => f.kind === "pli" || f.kind === "ra"); const cur = pliStatus(p).f;
      if (!fl.length) subDocs.push([p.name, p.company, "Nothing uploaded", "", "", "", "", "", "", "", "PLI missing"]);
      for (const f of fl) subDocs.push([p.name, p.company, f.kind === "pli" ? "PLI certificate" : "Risk assessment", f.kind === "pli" ? "Public liability insurance" : f.title || "", f.name, f.insurer || "", f.policyNo || "", f.cover || "", dayD(f.kind === "pli" ? f.expiry : f.raDate), toD(f.uploadedAt),
        f.kind === "pli" ? (f === cur || f.fid === cur?.fid ? pliStatus(p).label : "Superseded") : "Uploaded"]);
    }
    const docSheet = [["Ref", "Type", "Title", "Version", "Issued to", "Renewal (months)", "Minimum reading (mins)", "Words", "Status", "Last updated"]];
    for (const d of S.docs.slice().sort((a, b) => (a.order ?? 999) - (b.order ?? 999))) docSheet.push([d.ref, d.kind, d.title, d.version, d.audience || "all", d.renewalMonths || S.settings.renewalMonths, Math.ceil(requiredSec(d) / 60), d.words || 0, d.active === false ? "Withdrawn" : "Issued", toD(d.updatedAt)]);
    const wb = XLSX.utils.book_new();
    const mk = (aoa, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true, dateNF: "dd/mm/yyyy" }); ws["!cols"] = widths.map((w) => ({ wch: w })); ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: aoa[0].length - 1 } }) }; ws["!freeze"] = { xSplit: 1, ySplit: 1 }; return ws; };
    XLSX.utils.book_append_sheet(wb, mk(log, [24, 16, 24, 20, 26, 14, 11, 30, 9, 9, 13, 13, 20, 12, 11, 12]), "Sign-off log");
    XLSX.utils.book_append_sheet(wb, mk(summ, [24, 16, 24, 20, 26, 14, 10, 10, 10, 10, 10, 13, 13, 10, 16, 18, 16, 14, 13, 12, 30, ...LIC_ACTS.flatMap(() => [16, 12])]), "Summary by person");
    XLSX.utils.book_append_sheet(wb, mk(licSheet, [24, 16, 24, 14, 22, 22, 18, 13, 13, 16, 30]), "Licences");
    XLSX.utils.book_append_sheet(wb, mk(subDocs, [24, 24, 16, 28, 30, 18, 16, 14, 13, 13, 16]), "Sub-contractor documents");
    XLSX.utils.book_append_sheet(wb, mk(docSheet, [10, 7, 32, 8, 14, 10, 12, 8, 10, 13]), "Documents");
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx", cellDates: true });
    const stamp = new Date().toISOString().slice(0, 10);
    saveBlob(`Pickard SSOW-SOP sign-offs ${stamp}.xlsx`, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    toast("Spreadsheet saved");
  } catch (ex) {
    if (ex?.code === "declined") return;
    toast(ex?.code === "rate_limited" ? "A download prompt is already open." : `Couldn't create the spreadsheet: ${ex?.message || "try again"}`, 4500);
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* ---------- events ---------- */
function wireGlobal() {
  document.addEventListener("click", async (ev) => {
    const el = ev.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act;
    if (act === "close-modal-bg" && ev.target !== el) return;
    switch (act) {
      case "tab": setTab(el.dataset.tab); break;
      case "pick-type": S.draftType = el.dataset.type; if (!S.person) { S.personKey = null; } renderDetails(); break;
      case "back-welcome": S.draftType = null; S.view = S.person ? "home" : "welcome"; renderMain(); break;
      case "edit-details": S.draftType = S.person.type; renderDetails(); break;
      case "switch-person": setToken(null); S.person = null; S.personKey = null; S.view = "welcome"; renderMain(); window.scrollTo(0, 0); break;
      case "open-doc": if (R) leaveReader(false); openReader(el.dataset.ref); break;
      case "close-reader": leaveReader(true); break;
      case "sig-clear": R?.pad?.clear(); break;
      case "sig-reuse": if (S.person?.lastSig) R?.pad?.fromPath(S.person.lastSig); break;
      case "sign": doSign(); break;
      case "admin-tab": S.adminTab = el.dataset.k; S.editing = null; renderAdmin(); break;
      case "person": openPerson(el.dataset.key); break;
      case "close-modal": case "close-modal-bg": $("#modalSlot").innerHTML = ""; break;
      case "del-person-ask": $("#delRow").innerHTML = `<span class="small">Delete this person and all their sign-offs? This can't be undone.</span><button class="btn sm danger" data-act="del-person" data-key="${esc(el.dataset.key)}">Yes, delete</button><button class="btn sm" data-act="close-modal">Keep</button>`; break;
      case "del-person": {
        const key = el.dataset.key; const name = S.people.find((p) => p.key === key)?.name || "Person";
        el.disabled = true; const { ok } = await deletePeople([key]);
        S.pendingDel = null; $("#modalSlot").innerHTML = "";
        toast(ok ? `${name} deleted` : "Couldn't delete. Check your connection and try again.", 4000);
        if (!ok) renderAdmin(); break;
      }
      case "del-one-ask": S.pendingDel = el.dataset.key; S.bulkConfirm = false; renderAdmin(); break;
      case "del-cancel": S.pendingDel = null; renderAdmin(); break;
      case "psel": if (el.checked) S.peopleSel.add(el.dataset.key); else S.peopleSel.delete(el.dataset.key); S.bulkConfirm = false; renderAdmin(); break;
      case "psel-all": { const shown = [...document.querySelectorAll('input[data-act="psel"]')].map((x) => x.dataset.key); if (el.checked) shown.forEach((k) => S.peopleSel.add(k)); else shown.forEach((k) => S.peopleSel.delete(k)); S.bulkConfirm = false; renderAdmin(); break; }
      case "psel-none": S.peopleSel.clear(); S.bulkConfirm = false; renderAdmin(); break;
      case "bulk-ask": S.bulkConfirm = true; S.pendingDel = null; renderAdmin(); break;
      case "bulk-cancel": S.bulkConfirm = false; renderAdmin(); break;
      case "bulk-del": {
        S.deleting = true; renderAdmin();
        const { ok, failed } = await deletePeople([...S.peopleSel]);
        S.deleting = false; S.bulkConfirm = false; renderAdmin();
        toast(`${ok} ${ok === 1 ? "person" : "people"} deleted${failed ? `. ${failed} couldn't be deleted. Try again.` : ""}`, 4500);
        break;
      }
      case "export": exportXlsx(el); break;
      case "doc-new": openEditor(null); break;
      case "doc-notify": openNotify([{ ref: el.dataset.ref, isNew: false, manual: true }]); renderAdmin(); window.scrollTo(0, 0); break;
      case "notify-close": S.notify = null; renderAdmin(); break;
      case "notify-copy": copyNotify(el.dataset.what, el); break;
      case "doc-edit": openEditor(el.dataset.ref); break;
      case "ed-cancel": S.editing = null; renderAdmin(); break;
      case "ed-toggle-edit": toggleEditText(); break;
      case "ed-save": saveDoc(); break;
      case "stage-remove": S.staged = S.staged.filter((x) => x.id !== Number(el.dataset.id)); S.staged.forEach(computeStage); renderAdmin(); break;
      case "return-pick": findReturning(null, el.dataset.key); break;
      case "up-open": S.upOpen = el.dataset.kind; S.upDel = null; renderMain(); $("#up-file")?.focus(); break;
      case "up-cancel": S.upOpen = null; renderMain(); break;
      case "up-del-ask": S.upDel = el.dataset.fid; renderMain(); break;
      case "up-del-no": S.upDel = null; renderMain(); break;
      case "up-del": {
        const f = S.person?.files?.[el.dataset.fid]; el.disabled = true;
        try { await removeFile(S.personKey, el.dataset.fid); toast("File removed"); } catch (ex) { toast(ex?.message || "Couldn't remove the file. Try again."); }
        S.upDel = null; renderMain(); break;
      }
      case "file-dl": downloadFile(el.dataset.key, el.dataset.fid); break;
      case "pw-remove": removePw(); break;
      case "admin-lock": lockAdmin(); break;
      case "admin-signout": ssSet(ADMIN_PW_KEY, null); S.adminOk = false; S.people = []; S.peopleLoaded = false; $("#main").innerHTML = ""; renderAdmin(); break;
      case "stage-clear": S.staged = []; renderAdmin(); break;
      case "stage-save": publishStaged(); break;
      case "ed-del-ask": $("#edDelSlot").innerHTML = `<span class="small">Delete ${esc(S.editing.ref)}? Past sign-offs stay on people's records. Withdrawing it instead keeps it out of sight.</span> <button class="btn sm danger" data-act="ed-del">Yes, delete</button>`; break;
      case "ed-del": try { await api(`/api/admin/documents/${encodeURIComponent(S.editing.ref)}`, { method: "DELETE" }); S.docs = S.docs.filter((x) => x.ref !== S.editing.ref); toast(`${S.editing.ref} deleted`); S.editing = null; renderAdmin(); } catch { toast("Couldn't delete the document."); } break;
    }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "nt-body" && S.notify) { S.notify.msg = ev.target.value; return; }
    if (ev.target.dataset?.pq) { S.pq = ev.target.value; renderAdmin(); return; }
    if (ev.target.dataset?.ptype) { S.ptype = ev.target.value; renderAdmin(); return; }
    const k = ev.target.dataset?.flt; if (!k) return; S.filters[k] = ev.target.value; renderAdmin();
  });
  document.addEventListener("submit", (ev) => {
    if (ev.target.id === "setForm") saveSettings(ev);
    else if (ev.target.id === "pwForm") savePw(ev);
    else if (ev.target.id === "unlockForm") tryUnlock(ev);
    else if (ev.target.id === "upForm") submitUpload(ev);
    else if (ev.target.id === "returnForm") findReturning(ev);
  });
  wireDrop();
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $("#modalSlot").innerHTML) $("#modalSlot").innerHTML = ""; });
}
boot();
</script>
